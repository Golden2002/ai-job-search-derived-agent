<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话式简历制作</title>
<style>
:root{
  --brand-600:#4F46E5; --brand-500:#6366F1; --brand-700:#4338CA; --brand-50:#EEF2FF;
  --ink-900:#0F172A; --ink-700:#334155; --ink-500:#64748B; --ink-400:#94A3B8; --ink-200:#E2E8F0; --ink-100:#F1F5F9; --ink-50:#F8FAFC;
  --success:#10B981; --success-600:#059669; --warning:#F59E0B; --danger:#EF4444; --info:#0EA5E9;
  --bg-app:#F5F7FB; --surface:#FFFFFF;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --font:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-app);color:var(--ink-900);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.header{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--ink-200);position:relative;z-index:10}
.header .logo{font-weight:700;font-size:16px}
.header .crumb{color:var(--ink-500);font-size:13px}
.header .spacer{flex:1}
.btn{background:var(--brand-600);color:#fff;border:none;padding:8px 18px;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--brand-700)}
.btn.ghost{background:transparent;color:var(--brand-600);border:1px solid var(--ink-200)}
.btn.ghost:hover{background:var(--brand-50)}
.layout{display:grid;grid-template-columns:232px 1fr 340px;height:calc(100vh - 56px)}
@media(max-width:1279px){.layout{grid-template-columns:200px 1fr}}
@media(max-width:959px){.layout{grid-template-columns:1fr}.nav,.summary{display:none}}

.nav{background:var(--surface);border-right:1px solid var(--ink-200);overflow-y:auto;padding:12px}
.nav .scene-head{padding:8px;font-weight:700;font-size:14px;color:var(--ink-900);cursor:pointer;border-radius:var(--radius-sm)}
.nav .scene-head:hover{background:var(--ink-100)}
.nav .scene-head .count{font-size:11px;color:var(--ink-400);font-weight:400;float:right}
.nav .stage{padding:7px 8px 7px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--ink-700);display:flex;align-items:center;gap:8px}
.nav .stage:hover{background:var(--ink-100)}
.nav .stage.active{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-200);flex:0 0 auto}
.nav .dot.done{background:var(--success)}
.nav .dot.partial{background:var(--warning)}
.nav .stage.active .dot{background:var(--brand-600)}
.nav .upload{padding:12px 8px;border-top:1px solid var(--ink-200);margin-top:12px}
.nav .upload label{font-size:12px;color:var(--ink-500)}
.nav .upload input[type=file]{width:100%;margin-top:6px;font-size:12px}

.chat{display:flex;flex-direction:column;min-width:0}
.card-dock{background:var(--surface);border-bottom:1px solid var(--ink-200);padding:12px 16px;max-height:42%;overflow-y:auto}
.card-dock .card-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.card-dock .progress{font-size:12px;color:var(--ink-500);margin-left:auto}
.card-dock.collapsed .card-body{display:none}
.card-dock.collapsed .chev{transform:rotate(-90deg)}
.chev{transition:transform .2s}
.card-body .hint{font-size:12px;color:var(--ink-500);margin:6px 0 2px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:640px){.field-grid{grid-template-columns:1fr}}
.field{background:var(--ink-50);border:1px dashed var(--ink-200);border-radius:var(--radius-md);padding:8px 10px;cursor:pointer;transition:all .2s}
.field:hover{border-color:var(--brand-500)}
.field .f-label{font-size:12px;color:var(--ink-500);display:flex;align-items:center;gap:4px}
.field .f-label .tag{font-size:10px;color:var(--brand-600);background:var(--brand-50);padding:1px 6px;border-radius:var(--radius-sm)}
.field .f-value{font-size:13px;color:var(--ink-900);margin-top:3px;min-height:18px;word-break:break-all}
.field .f-value.placeholder{color:var(--ink-400)}
.field.filled{border:1px solid var(--success);background:#ECFDF5}
.field.partial{border:1px solid var(--warning)}
.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:10px 14px;border-radius:var(--radius-lg);font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.ai{background:var(--surface);border:1px solid var(--ink-200);align-self:flex-start}
.msg.user{background:var(--brand-600);color:#fff;align-self:flex-end}
.msg .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--brand-500);color:var(--brand-600);font-size:12px;cursor:pointer;background:#fff}
.chip:hover{background:var(--brand-50)}
.chip.sel{background:var(--brand-600);color:#fff;border-color:var(--brand-600)}
.composer{background:var(--surface);border-top:1px solid var(--ink-200);padding:10px 16px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid var(--ink-200);border-radius:var(--radius-md);padding:9px 12px;font-family:var(--font);font-size:14px;resize:none;height:40px;max-height:120px}
.composer textarea:focus{outline:none;border-color:var(--brand-500)}

.summary{background:var(--surface);border-left:1px solid var(--ink-200);overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.summary .s-head{font-weight:700;font-size:14px;margin-bottom:8px}
.summary .ring{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.summary .ring-num{font-size:24px;font-weight:700;color:var(--brand-600)}
.summary .ring-bar{flex:1;height:8px;background:var(--ink-100);border-radius:999px;overflow:hidden}
.summary .ring-fill{height:100%;background:var(--brand-600);border-radius:999px;transition:width .3s}
.summary .s-group{margin-bottom:14px}
.summary .s-group .g-name{font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:6px;display:flex;justify-content:space-between}
.summary .s-group .g-name .st{font-size:11px;color:var(--ink-400)}
.summary .s-item{font-size:12px;color:var(--ink-500);padding:3px 0;display:flex;justify-content:space-between;gap:8px}
.summary .s-item .v{color:var(--ink-900);text-align:right;word-break:break-all}
.summary .cta{margin-top:auto;padding-top:16px;border-top:1px solid var(--ink-200);display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="header">
  <span class="logo">📄 对话式简历制作</span>
  <span class="crumb" id="crumb">选择场景开始</span>
  <span class="spacer"></span>
  <button class="btn ghost" onclick="toggleCard()">维度卡片</button>
  <button class="btn" id="btnGen" onclick="generateResume()">生成简历</button>
</div>

<div class="layout">
  <aside class="nav" id="nav"></aside>
  <main class="chat">
    <div class="card-dock" id="cardDock">
      <div class="card-title" onclick="toggleCard()">
        <span class="chev">▾</span><span id="cardStageName">阶段卡片</span>
        <span class="progress" id="cardProgress"></span>
      </div>
      <div class="card-body" id="cardBody"></div>
    </div>
    <div class="msg-list" id="msgList"></div>
    <div class="composer">
      <textarea id="input" placeholder="说说你的经历，AI 会引导你补全信息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="btn" onclick="send()">发送</button>
    </div>
  </main>
  <aside class="summary" id="summary"></aside>
</div>

<script>
let scenes = [];
let state = {};     // {stageId: {fieldKey: value}}
let filled = {};    // {stageId: {fieldKey: "filled"|"partial"}}
let currentScene = null, currentStage = null;
let importedCss = null;

(async function init(){
  try{
    const r = await fetch('/api/scene-cards');
    const d = await r.json();
    if(d.ok){ scenes = d.scenes || []; }
  }catch(e){}
  renderNav();
  renderSummary();
  addMsg('ai','你好！我会通过对话帮你完整收集简历信息。先从左侧选择一个场景，我会按「阶段」逐条追问，帮你补全所有信息。也可以直接告诉我你的经历。');
})();

function findScene(id){ return scenes.find(s=>s.id===id); }
function findStage(id){ for(const s of scenes) for(const ss of s.sub_scenes||[]) for(const st of ss.stages||[]) if(st.id===id) return st; return null; }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = scenes.map(s => `
    <div class="scene-head" onclick="toggleScene('${s.id}')">${esc(s.label)}<span class="count">${(s.sub_scenes||[]).length} 子场景</span></div>
    <div id="scene-${s.id}">
      ${(s.sub_scenes||[]).map(ss => `
        <div class="dir-head">${esc(ss.label)}</div>
        ${(ss.stages||[]).map(st => `
          <div class="stage" data-stage="${st.id}" onclick="selectStage('${s.id}','${st.id}')">
            <span class="dot" id="dot-${st.id}"></span>${esc(st.label)}
          </div>`).join('')}
      `).join('')}
    </div>
    <div class="upload">
      <label>💡 已有简历？上传 Word/PDF/Excel/截图：</label>
      <input type="file" accept=".docx,.pdf,.xlsx,.xlsm,.png,.jpg,.jpeg,.webp,.bmp" onchange="uploadResume(this.files[0])">
      <div id="uploadMsg" style="font-size:11px;color:var(--success-600);margin-top:4px"></div>
    </div>
  `).join('');
}

function toggleScene(sid){ const el=document.getElementById('scene-'+sid); el.style.display = el.style.display==='none'?'':'none'; }

function selectStage(sid, stid){
  currentScene = sid; currentStage = stid;
  document.querySelectorAll('.nav .stage').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.nav .stage[data-stage="${stid}"]`).classList.add('active');
  const st = findStage(stid);
  const s = findScene(sid);
  const ss = (s.sub_scenes||[]).find(x => (x.stages||[]).some(y=>y.id===stid));
  document.getElementById('crumb').textContent = `${s.label} / ${ss?ss.label:''} / ${st.label}`;
  document.getElementById('cardStageName').textContent = st.label;
  renderCard(st);
  renderSummary();
  addMsg('ai', `开始收集「${st.label}」。${st.hint||''}`);
  askNext(st);
}

function renderCard(st){
  const body = document.getElementById('cardBody');
  body.innerHTML = `<div class="hint">${esc(st.hint||'')}</div>` + `<div class="field-grid">` + (st.fields||[]).map(f=>{
    const v = (state[st.id]||{})[f.key] || '';
    const stt = (filled[st.id]||{})[f.key] || 'empty';
    const cls = stt==='filled'?'filled':(stt==='partial'?'partial':'');
    const tag = {text:'文本',select:'枚举',multi:'多选',number:'数值',date_range:'日期',long:'长文本'}[f.type]||f.type;
    const val = v ? v : `<span class="placeholder">${esc(f.placeholder||'点击填写')}</span>`;
    return `<div class="field ${cls}" onclick="fillField('${st.id}','${f.key}')">
      <div class="f-label">${esc(f.label)}${f.required?'<span style="color:var(--danger)">*</span>':''}<span class="tag">${tag}</span></div>
      <div class="f-value">${val}</div>
    </div>`;
  }).join('') + `</div>`;
  updateProgress(st);
}

function updateProgress(st){
  const total = st.fields.length;
  const done = (st.fields||[]).filter(f=>(filled[st.id]||{})[f.key]==='filled').length;
  document.getElementById('cardProgress').textContent = `${done}/${total} 已收集`;
  const dot = document.getElementById('dot-'+st.id);
  if(dot){ dot.className='dot '+(done===total?'done':(done>0?'partial':'')); }
}

function fillField(stid, key){
  const st = findStage(stid);
  const f = st.fields.find(x=>x.key===key);
  let val;
  if(f.type==='select' && f.options){
    val = prompt(`${f.label}\n可选：${f.options.join(' / ')}`, (state[stid]||{})[key]||'');
  }else{
    val = prompt(`${f.label}${f.placeholder?'\n提示：'+f.placeholder:''}`, (state[stid]||{})[key]||'');
  }
  if(val===null) return;
  setField(stid, key, val.trim(), 'filled');
  addMsg('user', val.trim());
  addMsg('ai', `已记录「${f.label}」：${val.trim()}。`);
  askNext(st);
}

function setField(stid, key, val, status){
  if(!state[stid]) state[stid]={};
  if(!filled[stid]) filled[stid]={};
  state[stid][key]=val;
  filled[stid][key]=status||(val?'filled':'empty');
  const st=findStage(stid);
  renderCard(st); renderSummary();
}

function send(){
  const input=document.getElementById('input');
  const text=input.value.trim(); if(!text) return;
  input.value='';
  addMsg('user', text);
  if(currentStage){
    const st=findStage(currentStage);
    const f=(st.fields||[]).find(x=>!(filled[currentStage]||{})[x.key]||(filled[currentStage]||{})[x.key]==='empty');
    if(f){ setField(currentStage, f.key, text, 'filled'); addMsg('ai',`已记录「${f.label}」：${text}。`); }
    else{ addMsg('ai',`「${st.label}」已收集完整，可切换下一阶段或点击「生成简历」。`); }
    askNext(st);
  }else{ addMsg('ai','请先从左侧选择一个场景，或直接上传已有简历。'); }
}

function askNext(st){
  const empty=(st.fields||[]).filter(f=>!(filled[st.id]||{})[f.key]||(filled[st.id]||{})[f.key]==='empty');
  if(empty.length>0){
    const f=empty[0];
    let chips='';
    if((f.type==='select'||f.type==='multi') && f.options){
      chips=`<div class="chips">${f.options.map(o=>`<span class="chip" onclick="pickChip('${st.id}','${f.key}','${esc(o)}')">${esc(o)}</span>`).join('')}</div>`;
    }
    const hint=f.placeholder?`（${f.placeholder}）`:'';
    addMsg('ai',`下一个「${f.label}」${hint}：`, chips);
  }else{
    const done=(st.fields||[]).filter(f=>(filled[st.id]||{})[f.key]==='filled').length;
    addMsg('ai',`✅「${st.label}」已收集完整（${done} 项）。可切换下一阶段，或点击右上角「生成简历」。`);
  }
}

function pickChip(stid, key, val){
  const st=findStage(stid);
  const f=st.fields.find(x=>x.key===key);
  if(f.type==='multi'){
    const cur=(state[stid]||{})[key]||'';
    const arr=cur?cur.split('、'):[];
    if(arr.includes(val)){ arr.splice(arr.indexOf(val),1); }
    else{ arr.push(val); }
    setField(stid, key, arr.join('、'), arr.length?'filled':'empty');
    addMsg('user', val);
    if(arr.length){ addMsg('ai',`已记录「${f.label}」：${arr.join('、')}（可继续点选多个）。`); }
    renderCard(st);
  }else{
    setField(stid, key, val, 'filled');
    addMsg('user', val);
    addMsg('ai',`已记录「${f.label}」：${val}。`);
    askNext(st);
  }
}

function renderSummary(){
  const summary=document.getElementById('summary');
  let totalFields=0, filledFields=0, groups='';
  for(const s of scenes) for(const ss of s.sub_scenes||[]) for(const st of ss.stages||[]){
    const t=st.fields.length;
    const done=(st.fields||[]).filter(f=>(filled[st.id]||{})[f.key]==='filled').length;
    totalFields+=t; filledFields+=done;
    const items=(st.fields||[]).map(f=>{
      const v=(state[st.id]||{})[f.key]||'';
      return `<div class="s-item"><span>${esc(f.label)}</span><span class="v">${v?esc(v):'—'}</span></div>`;
    }).join('');
    groups+=`<div class="s-group"><div class="g-name"><span>${esc(st.label)}</span><span class="st">${done}/${t}</span></div>${items}</div>`;
  }
  const pct=totalFields?Math.round(filledFields/totalFields*100):0;
  summary.innerHTML=`<div class="s-head">信息汇总</div>
    <div class="ring"><span class="ring-num">${pct}%</span><div class="ring-bar"><div class="ring-fill" style="width:${pct}%"></div></div></div>
    ${groups}
    <div class="cta">
      <button class="btn" onclick="generateResume()">生成简历</button>
      <button class="btn ghost" onclick="downloadPDF()">导出 PDF</button>
      <button class="btn ghost" onclick="downloadWord()">导出 Word</button>
    </div>`;
}

function generateResume(){
  const lines=[];
  for(const s of scenes) for(const ss of s.sub_scenes||[]) for(const st of ss.stages||[]){
    const vals=(st.fields||[]).filter(f=>(state[st.id]||{})[f.key]).map(f=>`${f.label}：${(state[st.id]||{})[f.key]}`);
    if(vals.length){ lines.push(`### ${st.label}`); lines.push(vals.join('；')); }
  }
  window._resumeText=lines.join('\n');
  addMsg('ai',`已汇总完整信息（${lines.length} 行）。可导出 PDF（应用还原排版）或继续补充。`);
}

async function uploadResume(file){
  if(!file) return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const map={docx:'/api/import-docx',pdf:'/api/import-pdf',xlsx:'/api/import-xlsx',xlsm:'/api/import-xlsx',png:'/api/import-image',jpg:'/api/import-image',jpeg:'/api/import-image',webp:'/api/import-image',bmp:'/api/import-image'};
  const ep=map[ext]; if(!ep){document.getElementById('uploadMsg').textContent='不支持的类型';return;}
  const fd=new FormData(); fd.append('file',file);
  document.getElementById('uploadMsg').textContent='识别中…';
  try{
    const r=await fetch(ep,{method:'POST',body:fd});
    const d=await r.json();
    if(!d.ok){document.getElementById('uploadMsg').textContent=d.error||'失败';return;}
    importedCss=d.css;
    document.getElementById('uploadMsg').textContent='✅ 已还原排版';
    addMsg('ai',`已识别你的简历（${d.meta.paragraphs} 段），排版样式已保存。可继续对话补充，或直接导出。`);
  }catch(e){document.getElementById('uploadMsg').textContent='上传失败';}
}

async function downloadPDF(){
  const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({experiences:[],target_role:'',resume_text:window._resumeText||'',format:'pdf',template:'classic',custom_css:importedCss||undefined})});
  if(!r.ok){alert('PDF 导出失败（需 Chrome/Playwright）');return;}
  const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='我的简历.pdf'; a.click();
}
async function downloadWord(){
  const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({experiences:[],target_role:'',resume_text:window._resumeText||'',format:'docx'})});
  if(!r.ok){alert('Word 导出失败');return;}
  const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='我的简历.docx'; a.click();
}

function toggleCard(){document.getElementById('cardDock').classList.toggle('collapsed');}
function addMsg(role,text,chipsHtml=''){
  const list=document.getElementById('msgList');
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=text;
  if(chipsHtml){div.innerHTML=text.replace(/\n/g,'<br>')+chipsHtml;}
  list.appendChild(div);
  list.scrollTop=list.scrollHeight;
}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
