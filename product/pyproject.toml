[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-product"
version = "0.1.0"
description = "通用简历制作 Agent 独立产品（复用 medical-resume-agent 引擎 + ai-job-search 工作流）——经历→校验→定向表达→多格式导出 + MCP 插件"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "gunicorn>=23,<24", "fastmcp>=2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
resume_extract = ["pypdf>=5.0,<6", "python-docx>=1.1,<2"]
render = ["playwright>=1.40"]

[project.scripts]
resume-mcp = "resume_product.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["resume_product*"]

[tool.setuptools.package-data]
resume_product = ["data/*.json", "data/role_packs/*.json", "data/capability_tags/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
